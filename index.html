<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Математически дуел</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10182c;color:#f7faff;font-family:system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:clamp(12px,2vw,30px)}header,.settings,.scoreline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(26px,4vw,56px);letter-spacing:-.045em;margin:0}header p{color:#bccae1;margin:4px 0 16px}.settings{background:#202b43;padding:10px 14px;border-radius:16px;justify-content:flex-start}button,select{font:inherit;font-weight:750;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;touch-action:manipulation}select{background:#f5f7ff;color:#14203a}button{background:#eaf0ff;color:#15213b}button:disabled{cursor:default;opacity:.48}button:focus-visible,select:focus-visible{outline:3px solid #ffd166;outline-offset:3px}.start{background:#ffda78}.arena{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,2vw,26px)}.team{--accent:#80d5ff;--dark:#153858;background:var(--dark);border:2px solid var(--accent);border-radius:22px;padding:clamp(9px,2vw,26px);min-width:0}.team+ .team{--accent:#ffcc82;--dark:#4b2e24}.scoreline h2{margin:0;color:var(--accent);font-size:clamp(16px,2.4vw,34px)}.points{font-size:clamp(16px,2vw,28px);font-weight:800}.track{height:8px;background:#10182c;border-radius:8px;overflow:hidden;margin-top:10px}.track span{display:block;background:var(--accent);height:100%;transition:width .2s}.problem{margin:8px auto 6px;display:grid;width:max-content;grid-template-columns:auto auto;text-align:right;column-gap:.28em;font:800 clamp(24px,min(5vw,7vh),72px)/1.02 ui-monospace,monospace;letter-spacing:.05em}.problem .num{grid-column:2}.answer{grid-column:1/3;border-top:2px solid var(--accent);min-height:1.14em;color:var(--accent)}.answer span{display:inline-block;width:calc(1ch + .05em);text-align:center;box-shadow:inset 0 0 0 1px #ffffff40;letter-spacing:0}.answer .current{background:var(--accent);color:var(--dark)}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1vw,10px)}.keys button{font-size:clamp(15px,2.5vw,32px);padding:3px;min-height:clamp(42px,7.4vh,72px)}.keys .check{background:var(--accent)}.feedback{margin:5px 0 0;min-height:2.5em;font-weight:650;font-size:clamp(12px,1.3vw,18px)}.status{text-align:center;margin:9px 0;font-size:clamp(14px,2vw,25px);font-weight:750;min-height:1.4em}.winner{box-shadow:0 0 22px var(--accent)}@media(max-width:520px){.settings{gap:6px}.settings label{font-size:13px}.settings select{padding:7px}.scoreline{gap:4px}}
</style>
</head>
<body>
<main>
<header><div><h1>Математически дуел</h1><p>Събиране и изваждане без преминаване</p></div><button id="screen">⛶ Цял екран</button></header>
<div class="settings">
<label>Числа <select id="digits"><option value="2">Двуцифрени</option><option value="3">Трицифрени</option><option value="4">Четирицифрени</option></select></label>
<label>Действие <select id="mode"><option value="mix">Смесено</option><option value="+">Събиране</option><option value="−">Изваждане</option></select></label>
<label>Победа при <select id="goal"><option value="5">5 точки</option><option value="10" selected>10 точки</option><option value="15">15 точки</option></select></label>
<button id="start" class="start">Старт</button>
</div>
<p id="status" class="status" aria-live="polite">Докоснете „Старт“. Печели отборът, който първи събере нужните точки.</p>
<div class="arena" id="arena"></div>
</main>
<script>
const names = ['Син отбор', 'Оранжев отбор'];
const arena = document.querySelector('#arena');
const status = document.querySelector('#status');
const start = document.querySelector('#start');
const settings = [...document.querySelectorAll('select')];
const [digits, mode, goal] = settings;
const keys = ['1','2','3','4','5','6','7','8','9','0','⌫','✓'];
let active = false;
let target = Number(goal.value);
let tasks = [];
const teams = names.map((name, index) => {
  const panel = document.createElement('section');
  panel.className = 'team';
  panel.innerHTML = `<div class="scoreline"><h2>${name}</h2><span class="points">0 т.</span></div>
    <div class="track" aria-hidden="true"><span style="width:0"></span></div>
    <div class="problem"><span class="num first">—</span><span class="op"></span><span class="second">—</span><span class="answer" aria-label="Отговор">?</span></div>
    <div class="keys">${keys.map(key => `<button disabled type="button" data-key="${key}" ${key === '✓' ? 'class="check" aria-label="Провери"' : key === '⌫' ? 'aria-label="Изтрий последната въведена цифра"' : ''}>${key}</button>`).join('')}</div>
    <p class="feedback" aria-live="polite"></p>`;
  panel.querySelector('.keys').addEventListener('click', event => {
    const key = event.target.dataset.key;
    if (key) play(index, key);
  });
  arena.append(panel);
  return {panel, score:0, input:''};
});
const random = (min,max) => min + Math.floor(Math.random() * (max-min+1));
function makePair(length, operation) {
  const operands = [[],[]];
  const swapped = [[],[]];
  for (let column = 0; column < length; column++) {
    const leading = column === 0;
    const low = leading ? 1 : 0;
    const a = random(operation === '−' && leading ? 2 : low, operation === '+' && leading ? 8 : 9);
    const b = random(low, operation === '+' ? 9-a : a-(leading ? 1 : 0));
    operands[0].push(a);
    operands[1].push(b);
    swapped[0].push(a);
    swapped[1].push(b);
  }
  // Swap units and tens in longer tasks when the columns differ.
  // For two-digit tasks, match the column structure with fresh digits.
  if (length > 2 && operands.some(row => row[length-1] !== row[length-2])) {
    for (const row of swapped) [row[length-2],row[length-1]] = [row[length-1],row[length-2]];
  } else {
    const a = operands[0][0];
    const b = operands[1][0];
    const units = [];
    for (let x=0;x<=9;x++) for (let y=0;y<=9;y++) {
      const originalX = operands[0].at(-1);
      const originalY = operands[1].at(-1);
      if ((x===0)!==(originalX===0) || (y===0)!==(originalY===0)) continue;
      if (operation === '+' ? x+y>9 : x<y || (x===y)!==(originalX===originalY)) continue;
      if (x!==originalX || y!==originalY) units.push([x,y]);
    }
    if (units.length) {
      const [x,y] = units[random(0,units.length-1)];
      swapped[0][length-1]=x;
      swapped[1][length-1]=y;
    } else if (operation === '+') {
      swapped[0][0] = a === 1 ? 2 : a-1;
      swapped[1][0] = Math.min(b,9-swapped[0][0]);
    } else {
      swapped[0][0] = a === 2 ? 3 : a-1;
      swapped[1][0] = Math.min(b,swapped[0][0]-1);
    }
  }
  const pair = [operands,swapped].map(rows => {
    const [a,b] = rows.map(row => Number(row.join('')));
    return {a,b,operation,result:operation === '+' ? a+b : a-b};
  });
  return random(0,1) ? pair : pair.reverse();
}
function render(index) {
  const team = teams[index];
  const {panel, score, input} = team;
  const task = tasks[score]?.[index];
  panel.querySelector('.points').textContent = score + ' т.';
  panel.querySelector('.track span').style.width = 100*score/target + '%';
  const answer = panel.querySelector('.answer');
  const padded = input.padStart(Number(digits.value), ' ');
  const current = padded.length - input.length - 1;
  answer.innerHTML = [...padded].map((digit, column) =>
    `<span class="${column === current ? 'current' : ''}">${digit === ' ' ? '&nbsp;' : digit}</span>`
  ).join('');
  if (!task) return;
  panel.querySelector('.first').textContent = task.a;
  panel.querySelector('.op').textContent = task.operation;
  panel.querySelector('.second').textContent = task.b;
}
function setActive(value) {
  active = value;
  for (const field of settings) field.disabled = value;
  for (const button of arena.querySelectorAll('button')) button.disabled = !value;
}
function begin() {
  target = Number(goal.value);
  const first = random(0,1);
  tasks = Array.from({length:target}, (_,i) =>
    makePair(Number(digits.value), mode.value === 'mix' ? ['+','−'][(i+first)%2] : mode.value));
  teams.forEach((team,index) => {
    team.score = 0;
    team.input = '';
    team.panel.classList.remove('winner');
    team.panel.querySelector('.feedback').textContent = 'Започни от единиците вдясно. После натисни ✓.';
    render(index);
  });
  setActive(true);
  start.textContent = 'Прекрати рунда';
  status.textContent = 'Дуелът започна! Първи до ' + target + ' точки.';
}
start.addEventListener('click', () => {
  if (!active) { begin(); return; }
  setActive(false);
  status.textContent = 'Рундът е прекратен.';
  start.textContent = 'Нов рунд';
});
function play(index,key) {
  if (!active) return;
  const team = teams[index];
  const feedback = team.panel.querySelector('.feedback');
  if (key === '✓') {
    if (team.input.length !== Number(digits.value)) {
      feedback.textContent = 'Попълни всички полета. Започни от единиците.';
      return;
    }
    if (Number(team.input) !== tasks[team.score][index].result) {
      team.input = '';
      feedback.textContent = 'Опитай отново. Провери цифрите по колони.';
    } else {
      team.score++;
      feedback.textContent = 'Вярно! +1 точка';
      if (team.score === target) {
        render(index);
        team.panel.classList.add('winner');
        setActive(false);
        status.textContent = names[index] + ' печели с ' + target + ' точки!';
        start.textContent = 'Нов рунд';
        return;
      }
      team.input = '';
    }
  } else if (key === '⌫') {
    team.input = team.input.slice(1);
  } else if (team.input.length < Number(digits.value)) {
    team.input = key + team.input;
  }
  render(index);
}
const screen = document.querySelector('#screen');
screen.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    status.textContent = 'За цял екран използвайте F11 в браузъра.';
  }
});
document.addEventListener('fullscreenchange', () => {
  screen.textContent = document.fullscreenElement ? 'Изход от цял екран' : '⛶ Цял екран';
});
</script>
</body>
</html>
